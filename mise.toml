[tools]
go = "1.27.2"
pre-commit = "latest"

[tasks.pre-commit-install]
description = "Install pre-commit hooks using pre-commit and mise"
run = [
  "mise generate git-pre-commit -w",
  "pre-commit install"
]

[tasks.pre-commit]
description = "Run tasks for pre-commit hook"
depends = ["test"]

[tasks.deps]
description = "Update and Install Dependencies"
run = ["go get -u ./...", "go mod tidy"]

[tasks.test]
description = "run tests"
run = "go test -v -coverprofile=.coverage ./..."

[tasks.cov]
description = "Open Coverage Report"
run = "go tool cover -html=.coverage"
depends = ["test"]

[tasks.build]
description = "Build"
run = ["go build -o ./bin/sb -ldflags \"-X main.Version=$(git rev-parse --short HEAD)\" main.go"]
depends = ["test"]
